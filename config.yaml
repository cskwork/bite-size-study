# bite-size-study 설정
# 뇌과학 기반 학습 시스템 — 마이크로 습관 + 도파민 설계

# ── 세션 설정 ──────────────────────────────────
session:
  daily_cards: 3            # 하루 새 카드 수 (마이크로 습관: 적게 시작)
  max_review_cards: 5       # 하루 최대 복습 카드 수
  min_session_minutes: 5    # 최소 세션 시간 (5분 규칙)

# ── If-Then 앵커 ───────────────────────────────
# "만약 [상황]이 되면, 나는 [행동]을 할 것이다" (d=0.65)
anchors:
  - trigger: "아침 커피를 마실 때"
    action: "카드 2장 읽기"
  - trigger: "점심 식사 후"
    action: "복습 퀴즈 1회"

# ── 정체성 메시지 ──────────────────────────────
# 세션 시작 시 표시 (정체성 전환: r=0.55)
identity:
  message: "나는 매일 성장하는 개발자다."
  exam_goal: "정보처리기사 실기 합격"

# ── 유혹 묶기 ──────────────────────────────────
# 학습 후 보상 연결 (10-51% 향상)
rewards:
  daily: "좋아하는 음료 한 잔"
  streak_3: "맛있는 간식"
  streak_7: "좋아하는 콘텐츠 1시간"
  streak_30: "원하던 것 하나 구매"

# ── 커미트먼트 ─────────────────────────────────
# 주간 목표 (손실 회피: 달성률 78%)
commitment:
  weekly_cards: 15          # 주간 카드 학습 목표
  weekly_quizzes: 3         # 주간 퀴즈 목표

# ── 도파민 세팅 ────────────────────────────────
dopamine:
  show_streak: true         # 스트릭 표시
  show_level: true          # 레벨 표시
  show_progress_bar: true   # 과목별 진행바 표시
  celebration_emojis: true  # 완료 시 축하 표시
